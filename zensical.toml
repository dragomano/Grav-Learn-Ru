[project.plugins.tags]

[project.theme]
language = "ru"
favicon = "assets/favicon.png"
#logo = "assets/grav-logo.svg"
custom_dir = "overrides"
features = [
  "navigation.indexes",
  "navigation.path",
  "navigation.top",
  "navigation.footer",
  "navigation.tracking",
  "navigation.instant",
  "navigation.instant.prefetch",
  "toc.follow",
  "content.code.copy",
  "content.code.select",
  "content.code.annotate",
  "content.tooltips",
  "content.footnote.tooltips",
  "search.highlight",
  "search.suggest",
  "search.share",
]

[project.theme.icon]
logo = "fontawesome/brands/grav"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun"
toggle.name = "Переключиться в светлый режим"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Переключиться в тёмный режим"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun-moon"
toggle.name = "Переключиться на системную тему"

[project.theme.font]
text = "Inter"
code = "Jetbrains Mono"

[project.extra.analytics]
provider = "clarity"
property = "wjmrti7djz"

[[project.extra.social]]
icon = "fontawesome/brands/github"
name = "Репозиторий перевода"
link = "https://github.com/dragomano/Grav-Learn-Ru"

[[project.extra.social]]
icon = "fontawesome/brands/grav"
name = "Оригинальная документация Grav 2"
link = "https://learn.getgrav.org/2"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.quotes.callouts = true
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
